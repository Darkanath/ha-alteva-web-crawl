name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request diff for correctness bugs, security issues,
            and unnecessary complexity. Be concise and only comment on things
            that matter. Use the repository's CLAUDE.md and AGENTS.md for
            context on conventions.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git diff:*)"
